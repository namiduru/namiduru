<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title description">
  <title id="title">Mehmet Namıduru — Senior Full-Stack Engineer &amp; Team Lead</title>
  <desc id="description">Software engineering across energy, satellite networks and payments. Based in Barcelona, Spain. A subtle animated signal travels through an abstract network on the right.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d131d"/>
      <stop offset="1" stop-color="#142235"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="45%" r="55%">
      <stop stop-color="#5ee2bd" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5ee2bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grid-fade">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="0.65" stop-color="white" stop-opacity="0.45"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#7187a0" fill-opacity="0.25"/>
    </pattern>
    <mask id="grid-mask"><rect width="1000" height="320" fill="url(#grid-fade)"/></mask>
    <clipPath id="frame"><rect width="1000" height="320" rx="16"/></clipPath>
    <style>
      .signal { animation: flow 16s linear infinite; }
      .signal-secondary { animation-delay: -8s; animation-duration: 20s; }
      @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; stroke-dasharray: none; opacity: 0.2; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#surface)"/>
    <rect width="1000" height="320" fill="url(#glow)"/>
    <rect width="1000" height="320" fill="url(#grid)" mask="url(#grid-mask)"/>
    <circle cx="852" cy="160" r="167" fill="none" stroke="#a8c3df" stroke-opacity="0.05"/>
    <circle cx="852" cy="160" r="106" fill="none" stroke="#a8c3df" stroke-opacity="0.1"/>
    <circle cx="852" cy="160" r="84" fill="none" stroke="#a8c3df" stroke-opacity="0.12" stroke-dasharray="2 8"/>
    <g fill="none" stroke="#55738c" stroke-width="1.4" stroke-opacity="0.45">
      <path d="M732 137H784Q800 137 800 121V105Q800 88 818 88H878Q895 88 895 105V126Q895 143 913 143H946"/>
      <path d="M734 231H774Q793 231 793 210V199Q793 180 814 180H900Q916 180 916 197V213Q916 229 935 229H956"/>
      <path d="M838 70V112Q838 132 858 132H878V199"/>
    </g>
    <g fill="none" stroke="#70e3c1" stroke-width="2" stroke-linecap="round">
      <path class="signal" d="M732 137H784Q800 137 800 121V105Q800 88 818 88H878Q895 88 895 105V126Q895 143 913 143H946" pathLength="100" stroke-dasharray="5 95"/>
      <path class="signal signal-secondary" d="M734 231H774Q793 231 793 210V199Q793 180 814 180H900Q916 180 916 197V213Q916 229 935 229H956" pathLength="100" stroke-dasharray="5 95" opacity="0.65"/>
    </g>
    <g fill="#142235" stroke="#70e3c1" stroke-width="1.5">
      <circle cx="732" cy="137" r="4"/>
      <circle cx="946" cy="143" r="4"/>
      <circle cx="734" cy="231" r="4"/>
      <circle cx="956" cy="229" r="4"/>
      <circle cx="838" cy="70" r="3"/>
    </g>
    <rect x="814" y="122" width="76" height="76" rx="22" fill="#111e2b" stroke="#70e3c1" stroke-opacity="0.3"/>
    <path d="M832 153V141L852 132L872 141V153M832 167V179L852 188L872 179V167" fill="none" stroke="#70e3c1" stroke-opacity="0.2"/>
    <text x="852" y="169" text-anchor="middle" fill="#cdece3" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" letter-spacing="1">MN</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="48" y="44" fill="#70e3c1" font-size="12" font-weight="600" letter-spacing="2">MN / SOFTWARE ENGINEERING</text>
      <text x="952" y="44" text-anchor="end" fill="#95a8bf" font-size="12" letter-spacing="1.5">BARCELONA, SPAIN</text>
      <path d="M48 69H952" stroke="#90aecb" stroke-opacity="0.13"/>
      <text x="44" y="153" fill="#f0f4f8" font-size="68" font-weight="650" letter-spacing="-2.8">Mehmet Namıduru</text>
      <text x="48" y="201" fill="#bbc9da" font-size="23">Senior Full-Stack Engineer &amp; Team Lead</text>
      <path d="M48 248H670" stroke="#90aecb" stroke-opacity="0.16"/>
      <path d="M48 248H112" stroke="#70e3c1" stroke-width="2"/>
      <text x="48" y="284" fill="#95a8bf" font-size="12" letter-spacing="1.5">ENERGY / SATELLITE NETWORKS / PAYMENTS</text>
      <text x="952" y="284" text-anchor="end" fill="#95a8bf" font-size="11" letter-spacing="1.4">BUILDING SINCE 2017</text>
    </g>
